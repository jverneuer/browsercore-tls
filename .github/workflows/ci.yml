name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      - name: Generate COVERAGE.md
        run: node scripts/coverage-md.mjs
      - run: npm run build
      - name: Commit COVERAGE.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add COVERAGE.md coverage/badge.json
          if git diff --cached --quiet; then
            echo "coverage report unchanged — nothing to commit"
          else
            git commit -m "ci: update coverage report [skip ci]"
            git push
          fi
