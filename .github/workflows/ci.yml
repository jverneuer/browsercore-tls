name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.current }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint -- --deny-warnings
      - run: npm test -- --coverage
      - name: Enforce >=94% line coverage (MINIMUM=94)
        run: |
          node -e "
            const t=require('./coverage/coverage-summary.json').total;
            const MIN=94;
            console.log('Coverage: '+['statements','branches','lines','functions'].map(k=>k+' '+t[k].pct+'%').join(', '));
            const p=t.lines.pct;
            if(p<MIN){console.error('Line coverage '+p+'% < '+MIN+'% threshold');process.exit(1);}
            console.log('Line coverage '+p+'% >= '+MIN+'% OK');
          "
      - name: Generate COVERAGE.md
        run: npx coverage-md
      - run: npm run build

      # Determine whether this push changed the package version vs. the previous
      # commit on main. Publish + tag/release are gated on this so a push that
      # only touches source/docs/CI never triggers an npm publish or a release.
      - name: Detect version change
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          # Version at the parent commit (empty if this is the first commit).
          PARENT=$(git rev-parse --short HEAD^ 2>/dev/null || echo "")
          if [ -z "$PARENT" ]; then
            CHANGED="true"
          else
            PREVIOUS=$(git show "$PARENT:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              CHANGED="true"
            else
              CHANGED="false"
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Version $CURRENT (previous: ${PREVIOUS:-<none>}) — changed: $CHANGED"

      - name: Commit COVERAGE.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # coverage/ is gitignored; force-add the generated report + badge
          # so they are tracked in the repo root.
          git add -f COVERAGE.md coverage/badge.json
          if git diff --cached --quiet; then
            echo "coverage report unchanged — nothing to commit"
          else
            git commit -m "ci: update coverage report [skip ci]"
            git push origin HEAD:coverage --force-with-lease
          fi

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — skipping release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
